name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # Inlined at build time by Vite; the build guard refuses to run without
      # it (a missing value compiles every image URL to res.cloudinary.com/
      # undefined/... and ships a blank page). Public value, not a secret.
      VITE_CLOUDINARY_CLOUD_NAME: ece5jmhy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs before the other gates so a vulnerable dependency fails fast,
      # at the point where the fix is a one-line version bump. `high` is the
      # threshold deliberately: the 3 remaining moderate advisories
      # (@humanfs/node, @vitest/mocker) are dev-only test tooling with no
      # fixed release yet, and a gate that cannot go green is a gate people
      # learn to ignore. Bump the threshold once those ship fixes.
      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
